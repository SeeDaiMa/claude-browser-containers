[project]
name = "cbc-manager"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "maxminddb>=3.2.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.2",
  "playwright>=1.49.0",
  "pytest>=8.3.4",
  "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B"]
