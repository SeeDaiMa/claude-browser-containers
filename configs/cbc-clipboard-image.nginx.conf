# Host screenshots are posted by the noVNC page and placed on the X clipboard.
location = /cbc-clipboard-image {
	# Only the instance's own noVNC page may post a screenshot. The server-level
	# access guard already limits Host to this instance, so a POST Origin must
	# equal it. Same-origin status polling with GET sends no Origin.
	set $cbc_clipboard_request "$request_method $http_origin http://$http_host";
	if ($cbc_clipboard_request !~* "^(GET |POST (http://[^ ]+) \2$)") {
		return 403;
	}
	client_max_body_size 20m;
	proxy_pass http://unix:/tmp/cbc-clipboard-image.sock:/cbc-clipboard-image;
	proxy_read_timeout 10s;
	proxy_send_timeout 10s;
	access_log off;
}
